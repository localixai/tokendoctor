name: Something is wrong
description: A report that counts wrong, a check that misreads your setup, a change that did not apply or undo
labels: [bug]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, and what it printed. Remove paths and anything private first.
      render: text
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: What you see, and what you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tokendoctor and Claude Code versions
      placeholder: tokendoctor 0.6.0, Claude Code 2.4.1
    validations:
      required: true
  - type: dropdown
    id: login
    attributes:
      label: How Claude Code is signed in
      options:
        - Pro or Max
        - Team or Enterprise
        - An API key or a cloud provider
    validations:
      required: true
