# Checks site/ (tokendoctor.dev: the landing and the docs) on every change to it on main, and
# publishes what it built to Cloudflare Pages, project token-doctor. Publishing needs two
# repository secrets, CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID; until both are set the run only checks. Nothing here runs for a pull
# request: ci.yml builds the site there.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # The landing's releases are read from it (site/CHANGELOG.md links to it).
      - 'CHANGELOG.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# The newest build wins: an older one still running has nothing to add.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          # No dependency cache in a run that publishes: a poisoned cache would reach the site.
          package-manager-cache: false
      - run: npm ci
      # The layers, the types, the build and the docs' standard; it leaves the site in dist/.
      - run: npm run check
      - name: Publish dist/ to Pages
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0'
          workingDirectory: site
          command: pages deploy dist --project-name=token-doctor --branch=main
